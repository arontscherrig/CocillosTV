name: Update weekly menu

on:
  schedule:
    # Montag bis Freitag um 08:20 Uhr Schweizer Sommerzeit / 07:20 Uhr Winterzeit.
    - cron: "20 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weekly-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Wochenmenü abrufen
        run: python scripts/update-weekly-menu.py

      - name: Änderung veröffentlichen
        run: |
          if git diff --quiet -- data/weekly-menu.json; then
            echo "Keine Menüänderung gefunden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-menu.json
          git commit -m "Update Simplon weekly menu"
          git push
